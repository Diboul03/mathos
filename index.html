<style>

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {--fond: #16181d; --carte: #20232a; --encre: #eceef2; --encre2: #b4b8c3; --muet: #868b97;
    --ligne: #333741; --accent: #6b9bf0; --accent-doux: #243150; --accent-encre: #0e1320;
    --ok: #4fc282; --ok-doux: #1d3527; --ko: #ef7a68; --ko-doux: #3d2420; --att: #e2a84c; --att-doux: #3a2f1b;
    --ombre: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; }
}
:root[data-theme="dark"] {--fond: #16181d; --carte: #20232a; --encre: #eceef2; --encre2: #b4b8c3; --muet: #868b97;
    --ligne: #333741; --accent: #6b9bf0; --accent-doux: #243150; --accent-encre: #0e1320;
    --ok: #4fc282; --ok-doux: #1d3527; --ko: #ef7a68; --ko-doux: #3d2420; --att: #e2a84c; --att-doux: #3a2f1b;
    --ombre: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--fond); color: var(--encre);
  font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
button { font: inherit; cursor: pointer; }
.app { max-width: 920px; margin: 0 auto; padding-block: 16px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.barre { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.logo { font-weight: 800; font-size: 22px; letter-spacing: -.02em; cursor: pointer; }
.logo span { color: var(--accent); }
nav { display: flex; gap: 6px; flex-wrap: wrap; }
nav button { background: none; border: 0; padding: 6px 12px; border-radius: 8px; color: var(--encre2); }
nav button.actif, nav button:hover { background: var(--accent-doux); color: var(--encre); }
.pastille { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--ligne); background: var(--carte); color: var(--encre2); }
.pastille i { width: 8px; height: 8px; border-radius: 50%; background: var(--muet); display: inline-block; }
.pastille.ok i { background: var(--ok); } .pastille.erreur i, .pastille.reconnecter i { background: var(--ko); } .pastille.sync i { background: var(--att); }
.pastille.cliquable { cursor: pointer; }
.carte { background: var(--carte); border: 1px solid var(--ligne); border-radius: 14px; padding: 20px; box-shadow: var(--ombre); margin-bottom: 16px; }
h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -.02em; } h2 { font-size: 20px; margin: 0 0 12px; } h3 { font-size: 17px; margin: 16px 0 6px; }
.sous { color: var(--encre2); margin: 0 0 16px; }
.grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.tuile { text-align: left; background: var(--carte); border: 1px solid var(--ligne); border-radius: 14px; padding: 18px; box-shadow: var(--ombre); color: var(--encre); }
.tuile:hover { border-color: var(--accent); }
.tuile b { display: block; font-size: 18px; margin: 6px 0 2px; } .tuile small { color: var(--encre2); }
.tuile .ico { font-size: 26px; }
.btn { background: var(--accent); color: var(--accent-encre); border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 600; }
.btn.sec { background: var(--carte); color: var(--encre); border: 1px solid var(--ligne); }
.btn.ok { background: var(--ok); color: #fff; } .btn.ko { background: var(--ko); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.ligne-btn { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
.choix-mode { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choix-mode label { border: 2px solid var(--ligne); border-radius: 12px; padding: 14px; cursor: pointer; display: block; }
.choix-mode input { display: none; }
.choix-mode input:checked + label { border-color: var(--accent); background: var(--accent-doux); }
.themes-sel { display: flex; flex-wrap: wrap; gap: 8px; }
.themes-sel button { border: 1px solid var(--ligne); background: var(--carte); color: var(--encre); border-radius: 999px; padding: 6px 14px; }
.themes-sel button.on { background: var(--accent); color: var(--accent-encre); border-color: var(--accent); }

.entete-q { display: flex; justify-content: space-between; align-items: center; color: var(--encre2); font-size: 14px; margin-bottom: 8px; gap: 10px; }

.frac > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 3px; }
.qcm { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qcm button { text-align: left; padding: 14px 16px; border-radius: 12px; border: 2px solid var(--ligne); background: var(--carte); color: var(--encre); font-size: 19px; }
.oral .qcm button { font-size: 24px; cursor: default; }
.qcm button .l { display: inline-block; width: 26px; color: var(--muet); font-weight: 700; }
.qcm button.sel { border-color: var(--accent); background: var(--accent-doux); }
.qcm button.bonne { border-color: var(--ok); background: var(--ok-doux); }
.qcm button.fausse { border-color: var(--ko); background: var(--ko-doux); }
.saisie { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.saisie input { font-size: 22px; padding: 10px 14px; border-radius: 10px; border: 2px solid var(--ligne); background: var(--carte); color: var(--encre); width: 220px; }
.saisie input:focus { outline: none; border-color: var(--accent); }
.aide { font-size: 13px; color: var(--muet); margin-top: 6px; }
.retour { border-radius: 12px; padding: 14px 16px; margin-top: 18px; }
.retour.ok { background: var(--ok-doux); } .retour.ko { background: var(--ko-doux); } .retour.neutre { background: var(--accent-doux); }
.retour .titre { font-weight: 700; margin-bottom: 4px; }
.retour.ok .titre { color: var(--ok); } .retour.ko .titre { color: var(--ko); }
.fig { display: block; margin: 0 auto 16px; max-width: 100%; height: auto; }
.fig .grille { stroke: var(--ligne); stroke-width: 1; } .fig .axe { stroke: var(--encre2); stroke-width: 1.5; }
.fig .courbe { stroke: var(--accent); stroke-width: 2.5; } .fig .trait { fill: none; stroke: var(--encre); stroke-width: 2; }
.fig .code { stroke: var(--accent); stroke-width: 2; } .fig .fin { stroke-width: 1.3; fill: none; } .fig .cache { stroke-dasharray: 5 4; stroke-width: 1.5; }
.fig .pt { fill: var(--accent); } .fig .barre { fill: var(--accent); } .fig .motif { fill: var(--accent); opacity: .75; }
.fig .secteur { stroke: var(--carte); stroke-width: 2; } .fig .s0 { fill: #2f6fdb; } .fig .s1 { fill: #e08a1e; } .fig .s2 { fill: #0f9d76; } .fig .s3 { fill: #8a5ad9; }
.fig .lbl.b.blanc { fill: #fff; } .fig text { font-family: inherit; }
.scratch { display: inline-block; margin: 12px 0 4px; font-size: 15px; font-weight: 600; color: #fff; }
.scratch .blk { padding: 6px 12px; border-radius: 6px; margin: 2px 0; display: block; width: max-content; }
.scratch .ev { background: #d9a400; border-radius: 14px 14px 6px 6px; } .scratch .mv { background: #4c7fdb; } .scratch .pen { background: #0f9d76; }
.scratch .ctl { background: #e08a1e; padding-bottom: 4px; } .scratch .ctl .in { margin: 4px 0 2px 16px; } .scratch .var { background: #e3721b; }
.scratch .sen { background: #3aa3cf; } .scratch .look { background: #8a5ad9; }
.scratch .box { background: #fff; color: #333; border-radius: 10px; padding: 0 8px; margin: 0 2px; font-weight: 500; }
.fig .lbl { fill: var(--encre2); font-size: 12px; } .fig .lbl.b { fill: var(--encre); font-size: 15px; font-weight: 600; } .fig .courbe-lbl { fill: var(--accent); font-size: 14px; }
table.tab { border-collapse: collapse; margin: 10px 0; font-size: 18px; }
table.tab td { border: 1px solid var(--encre2); padding: 4px 14px; text-align: center; }
/* Bilan / progrès */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--carte); border: 1px solid var(--ligne); border-radius: 12px; padding: 14px; }
.kpi .v { font-size: 28px; font-weight: 800; letter-spacing: -.02em; } .kpi .t { font-size: 13px; color: var(--encre2); }
.barre-theme { display: grid; grid-template-columns: 190px 1fr 160px; gap: 10px; align-items: center; padding: 6px 0; font-size: 15px; }
.barre-theme .rail { height: 10px; background: var(--ligne); border-radius: 5px; overflow: hidden; }
.barre-theme .rail div { height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
.niveau { font-size: 13px; color: var(--encre2); white-space: nowrap; }
.niveau.m { color: var(--ok); } .niveau.a { color: var(--ko); } .niveau.e { color: var(--att); }
table.hist { width: 100%; border-collapse: collapse; font-size: 14px; }
table.hist th, table.hist td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--ligne); }
table.hist th { color: var(--encre2); font-weight: 600; }
table.hist tr.alerte td { color: var(--ko); }
.erreur-item { border-left: 4px solid var(--ko); padding: 8px 14px; margin: 12px 0; background: var(--fond); border-radius: 0 10px 10px 0; }
.erreur-item.juste { border-left-color: var(--ok); }
.erreur-item .q { font-weight: 600; margin-bottom: 4px; }
.graph svg { width: 100%; height: auto; display: block; }
.graph .axe { stroke: var(--ligne); } .graph .ligne { stroke: var(--accent); stroke-width: 2; fill: none; }
.graph .pt { fill: var(--accent); stroke: var(--carte); stroke-width: 2; } .graph text { fill: var(--muet); font-size: 11px; }
.bulle { position: fixed; pointer-events: none; background: var(--encre); color: var(--fond); font-size: 13px; padding: 6px 10px; border-radius: 8px; display: none; z-index: 9; }
.regles li { margin-bottom: 8px; } .regles .encadre { background: var(--accent-doux); border-radius: 12px; padding: 14px 18px; margin: 12px 0; }
.form-ligne { display: flex; align-items: center; gap: 12px; margin: 10px 0; flex-wrap: wrap; }
.form-ligne label { width: 210px; color: var(--encre2); }
.form-ligne input { font-size: 16px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--ligne); background: var(--carte); color: var(--encre); }
.note { font-size: 14px; color: var(--encre2); }
.cache { display: none !important; }
/* Fenêtres positionnées dans la page (et non au centre de l'écran) : MathOS peut être affiché dans un grand cadre Google Sites */
.boite-fond { position: absolute; left: 0; top: 0; width: 100%; background: rgba(10, 14, 24, .45); padding: 0 16px; z-index: 20; box-sizing: border-box; }
.boite-fond .boite { margin: 0 auto; }
.boite { background: var(--carte); color: var(--encre); border-radius: 14px; padding: 20px; max-width: 420px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.boite input { margin-top: 12px; width: 100%; font-size: 17px; padding: 9px 12px; border-radius: 8px; border: 2px solid var(--ligne); background: var(--fond); color: var(--encre); }
.toast { position: absolute; left: 50%; transform: translateX(-50%); background: var(--encre); color: var(--fond); padding: 10px 16px; border-radius: 10px; font-size: 15px; z-index: 30; max-width: calc(100% - 32px); }
.touches { display: none; gap: 6px; } .touche { padding: 10px 14px; min-width: 44px; font-size: 18px; }
@media (pointer: coarse) { .touches { display: inline-flex; } }
@media (max-width: 640px) {
  .qcm, .choix-mode { grid-template-columns: 1fr; }
  .barre-theme { grid-template-columns: 1fr 90px; } .barre-theme .rail { grid-column: 1 / 3; grid-row: 2; }
  .enonce { font-size: 19px; } .oral .enonce { font-size: 24px; }
  .carte { padding: 14px; } h1 { font-size: 23px; } .app { padding-top: 10px; }
  nav button { padding: 6px 8px; font-size: 15px; } header.barre { gap: 8px; margin-bottom: 14px; }
  .saisie input { flex: 1 1 140px; width: auto; min-width: 0; } .qcm button { font-size: 17px; padding: 12px 14px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi .v { font-size: 23px; }
  .form-ligne label { width: 100%; } .tuile { padding: 14px; }
}
.hist-wrap { overflow-x: auto; }
details.fiche { margin-top: 10px; background: var(--carte); border: 1px solid var(--ligne); border-radius: 10px; padding: 8px 12px; }
details.fiche summary { cursor: pointer; font-weight: 600; color: var(--accent); } details.fiche p { margin: 8px 0; }
.brouillon { margin-top: 14px; } .brouillon canvas { width: 100%; height: 320px; display: block; border: 2px dashed var(--ligne); border-radius: 12px; background: var(--fond); touch-action: none; cursor: crosshair; }
details.classe { border-top: 1px solid var(--ligne); padding: 8px 0; } details.classe summary { cursor: pointer; font-weight: 600; }
label.coche { display: block; padding: 4px 0 4px 8px; font-size: 15px; } label.coche input { margin-right: 6px; }
.semaine { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
.sem-v { font-size: 19px; font-weight: 700; margin: 2px 0 6px; } .semaine .rail { height: 8px; background: var(--ligne); border-radius: 4px; overflow: hidden; }
.semaine .rail div { height: 100%; background: var(--ok); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.badge { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 10px; border: 1px dashed var(--ligne); color: var(--muet); font-size: 14px; }
.badge .b-ico { font-size: 22px; filter: grayscale(1); opacity: .45; }
.badge.obtenu { border-style: solid; border-color: var(--accent); background: var(--accent-doux); color: var(--encre); }
.badge.obtenu .b-ico { filter: none; opacity: 1; } .fig { max-width: 100%; height: auto; }

<script>
/* MathOS — générateurs d'exercices d'automatismes (brevet, 3e).
   Chaque générateur renvoie une question nouvelle à chaque appel :
   { gen, theme, texte, type: 'qcm' | 'num', choix, bonne, valeur, reponse, correction, figure,
     pieges (num) / explications (qcm) : explication de l'erreur probable selon la réponse donnée } */
(function (global) {
  'use strict';

  // ---------- Outils ----------
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function nz(a, b) { var x; do { x = rnd(a, b); } while (x === 0); return x; }
  function pick(t) { return t[Math.floor(Math.random() * t.length)]; }
  function shuffle(t) {
    t = t.slice();
    for (var i = t.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = t[i]; t[i] = t[j]; t[j] = x; }
    return t;
  }
  function E_shuffleSlice(t, n) { return shuffle(t).slice(0, n); }
  function pgcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = b; b = a % b; a = t; } return a; }
  function arr(x) { return Math.round(x * 1e9) / 1e9; }

  // Nombre au format français : virgule décimale, signe moins typographique, espaces de milliers
  function f(x) {
    x = arr(x);
    var neg = x < 0; x = Math.abs(x);
    var s = x.toString();
    if (s.indexOf('e') >= 0) s = x.toFixed(10).replace(/0+$/, '').replace(/\.$/, '');
    var parts = s.split('.');
    var ent = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return (neg ? '−' : '') + ent + (parts[1] ? ',' + parts[1] : '');
  }
  // Nombre entre parenthèses s'il est négatif
  function p(x) { return x < 0 ? '(' + f(x) + ')' : f(x); }
  // Fraction affichée (HTML)
  function fr(n, d) {
    if (typeof n !== 'number' || typeof d !== 'number') return '<span class="frac"><span>' + n + '</span><span>' + d + '</span></span>';
    if (d < 0) { n = -n; d = -d; }
    if (d === 1) return f(n);
    return (n < 0 ? '−' : '') + '<span class="frac"><span>' + Math.abs(n) + '</span><span>' + d + '</span></span>';
  }
  function frIrr(n, d) { var g = pgcd(n, d) || 1; return fr(n / g, d / g); }
  // Expression ax + b
  function aff(a, b, v) {
    v = v || 'x';
    var s = '';
    if (a !== 0) s = (a === 1 ? '' : a === -1 ? '−' : f(a)) + v;
    if (b !== 0) s += s === '' ? f(b) : (b > 0 ? ' + ' + f(b) : ' − ' + f(-b));
    return s === '' ? '0' : s;
  }
  // Polynôme c2 x² + c1 x + c0
  function poly(c2, c1, c0) {
    var s = '';
    [[c2, 'x²'], [c1, 'x'], [c0, '']].forEach(function (t) {
      var c = t[0], v = t[1];
      if (c === 0) return;
      var abs = Math.abs(c);
      var corps = (abs === 1 && v) ? v : f(abs) + v;
      if (s === '') s = (c < 0 ? '−' : '') + corps;
      else s += (c < 0 ? ' − ' : ' + ') + corps;
    });
    return s || '0';
  }
  function puiss(b, e) { return b + '<sup>' + f(e) + '</sup>'; }

  // ---------- Fabriques de questions ----------
  // pieges : [[valeur fausse attendue, explication de l'erreur], ...]
  function num(texte, valeur, correction, opts) {
    opts = opts || {};
    return { type: 'num', texte: texte, valeur: valeur, reponse: opts.affiche || f(valeur), unite: opts.unite || '',
             correction: correction, figure: opts.figure || '', aide: opts.aide || '', pieges: opts.pieges || [], accepte: opts.accepte };
  }
  // fausses : chaînes ou [chaîne, explication de pourquoi ce choix est faux]
  function qcm(texte, bonne, fausses, correction, opts) {
    opts = opts || {};
    var vus = {}; vus[bonne] = 1;
    var autres = [], expl = {};
    fausses.forEach(function (x) {
      var txt = Array.isArray(x) ? x[0] : x;
      if (!vus[txt] && autres.length < 3) { vus[txt] = 1; autres.push(txt); if (Array.isArray(x)) expl[txt] = x[1]; }
    });
    var choix = opts.ordre ? [bonne].concat(autres) : shuffle([bonne].concat(autres));
    return { type: 'qcm', texte: texte, choix: choix, bonne: choix.indexOf(bonne), reponse: bonne,
             correction: correction, figure: opts.figure || '',
             explications: choix.map(function (c) { return expl[c] || ''; }) };
  }

  var THEMES = [
    { id: 'calcul', nom: 'Calcul numérique', icone: '🔢' },
    { id: 'fractions', nom: 'Fractions', icone: '🍰' },
    { id: 'puissances', nom: 'Puissances', icone: '⚡' },
    { id: 'pourcentages', nom: 'Pourcentages', icone: '％' },
    { id: 'proportionnalite', nom: 'Proportionnalité', icone: '⚖️' },
    { id: 'litteral', nom: 'Calcul littéral', icone: '✏️' },
    { id: 'equations', nom: 'Équations', icone: '🟰' },
    { id: 'arithmetique', nom: 'Arithmétique', icone: '🧮' },

  // Graphique d'une fonction affine sur une grille de −5 à 5
  function graphe(a, b) {

    function X(x) { return O + x * U; } function Y(y) { return O - y * U; }

    for (var i = -5; i <= 5; i++) {
      s += '<line class="grille" x1="' + X(i) + '" y1="' + Y(-5.5) + '" x2="' + X(i) + '" y2="' + Y(5.5) + '"/>';
      s += '<line class="grille" x1="' + X(-5.5) + '" y1="' + Y(i) + '" x2="' + X(5.5) + '" y2="' + Y(i) + '"/>';
    }
    s += '<line class="axe" x1="' + X(-5.5) + '" y1="' + O + '" x2="' + X(5.6) + '" y2="' + O + '"/><line class="axe" x1="' + O + '" y1="' + Y(-5.5) + '" x2="' + O + '" y2="' + Y(5.6) + '"/>';
    s += '<text class="lbl" x="' + (X(1) - 3) + '" y="' + (O + 14) + '">1</text><text class="lbl" x="' + (O - 12) + '" y="' + (Y(1) + 4) + '">1</text><text class="lbl" x="' + (O - 12) + '" y="' + (O + 14) + '">0</text>';
    var pts = [];
    [-5.5, 5.5].forEach(function (x) { var y = a * x + b; if (y >= -5.5 && y <= 5.5) pts.push([x, y]); });

    pts.sort(function (u, v) { return u[0] - v[0]; });
    var fin = pts[pts.length - 1];

    s += '<text class="lbl courbe-lbl" x="' + (X(fin[0]) - 22) + '" y="' + (Y(fin[1]) + (a > 0 ? 16 : -6)) + '">𝒞f</text>';
    return s + '</svg>';
  }

  function svg(w, h, label, corps) { return '<svg class="fig" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" role="img" aria-label="' + label + '">' + corps + '</svg>'; }
  function T(x, y, t, cls, ancre) { return '<text class="lbl' + (cls ? ' ' + cls : '') + '" x="' + x + '" y="' + y + '"' + (ancre ? ' text-anchor="' + ancre + '"' : '') + '>' + t + '</text>'; }

  function poly2(pts, cls) { return '<polygon class="' + (cls || 'trait') + '" points="' + pts.map(function (q) { return q[0] + ',' + q[1]; }).join(' ') + '"/>'; }
  // Codage d'un segment : n petits traits au milieu
  function codeSeg(P, Q, n) {
    var mx = (P[0] + Q[0]) / 2, my = (P[1] + Q[1]) / 2, dx = Q[0] - P[0], dy = Q[1] - P[1], l = Math.sqrt(dx * dx + dy * dy);
    var ux = dx / l, uy = dy / l, s = '';
    for (var i = 0; i < n; i++) {
      var o = (i - (n - 1) / 2) * 5, cx = mx + ux * o, cy = my + uy * o;
      s += Lg(cx - uy * 6, cy + ux * 6, cx + uy * 6, cy - ux * 6, 'code');
    }
    return s;
  }

  function angleDroit(P, Q, R) {

    var a = u(Q), b = u(R);
    return '<polyline class="trait fin" points="' + (P[0] + a[0]) + ',' + (P[1] + a[1]) + ' ' + (P[0] + a[0] + b[0]) + ',' + (P[1] + a[1] + b[1]) + ' ' + (P[0] + b[0]) + ',' + (P[1] + b[1]) + '"/>';
  }

<script>
/* MathOS (version Google Apps Script) — progression commune dans un fichier du Google Drive,
   lue et écrite par Code.gs. Même interface que sync.js pour que app.js serve à toutes les versions.
   Un code d'accès est demandé une fois par appareil ; le serveur le vérifie à chaque appel.
   Une copie locale sert d'affichage immédiat et garde les séances non envoyées (hors ligne). */
(function (global) {
  'use strict';

  var CLE = 'mathos.gas.v1', ATTENTE = 'mathos.gas.attente', CODE = 'mathos.gas.code';
  var ecouteurs = [], surMaj = null;
  var etat = { statut: 'sync', message: 'Connexion…', derniere: null };

  function vide() { return { version: 1, reglages: { prenom: '', dateBrevet: '2027-06-24', maj: 0, reinit: 0 }, seances: [] }; }
  function lireLocal(cle, defaut) { try { var v = JSON.parse(localStorage.getItem(cle)); return v === null ? defaut : v; } catch (e) { return defaut; } }
  function ecrireLocal(cle, v) { try { localStorage.setItem(cle, JSON.stringify(v)); } catch (e) {} }

  var donnees = lireLocal(CLE, null) || vide();
  donnees.reglages = Object.assign(vide().reglages, donnees.reglages);
  var attente = lireLocal(ATTENTE, []);
  var code = lireLocal(CODE, '');
  var codeParent = '';   // gardé seulement pendant la visite : redemandé à chaque ouverture

  function notifier(statut, message) {
    etat.statut = statut; etat.message = message;
    if (statut === 'ok') etat.derniere = new Date();
    ecouteurs.forEach(function (fn) { fn(etat); });
  }

  // Appel d'une fonction de Code.gs sous forme de promesse
  function serveur(nom) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (ok, ko) {
      if (!global.google || !google.script || !google.script.run) {
        // page hébergée hors de Google (GitHub Pages) : appel du programme Google par internet
        if (!global.MATHOS_API) return ko(new Error('hors-ligne'));
        return fetch(global.MATHOS_API, { method: 'POST', body: JSON.stringify({ f: nom, args: args }) })
          .then(function (r) { return r.json(); })
          .then(function (rep) { if (rep.ok) ok(rep.resultat); else ko(new Error(rep.erreur)); }, ko);
      }
      var r = google.script.run.withSuccessHandler(ok).withFailureHandler(ko);
      r[nom].apply(r, args);
    });
  }

  // Les séances en attente restent visibles tant qu'elles ne sont pas arrivées dans le Drive
  function recevoir(json) {
    var d = JSON.parse(json);
    donnees.reglages = Object.assign(vide().reglages, d.reglages);
    var ids = {}; d.seances.forEach(function (s) { ids[s.id] = 1; });
    attente = attente.filter(function (s) { return !ids[s.id] && new Date(s.debut).getTime() >= (donnees.reglages.reinit || 0); });
    ecrireLocal(ATTENTE, attente);
    donnees.seances = d.seances.concat(attente).sort(function (a, b) { return a.debut < b.debut ? -1 : 1; });
    ecrireLocal(CLE, donnees);
    notifier('ok', 'Progression enregistrée dans Google Drive');
    if (surMaj) surMaj();
  }
  function echec(e) {
    if (e && /code parent/.test(e.message || '')) { codeParent = ''; notifier('erreur', 'Code parent requis pour modifier les réglages'); return; }
    if (e && /code/.test(e.message || '')) { code = ''; ecrireLocal(CODE, ''); demanderCode(); return; }
    notifier('erreur', attente.length ? attente.length + ' séance(s) en attente d\'envoi' : 'Drive injoignable pour le moment');
  }

  // Nom de l'appareil pour le journal des connexions : celui choisi par les parents, sinon une description automatique
  function appareil() {
    var nom = ''; try { nom = localStorage.getItem('mathos.poste') || ''; } catch (e) {}
    if (nom) return nom;
    var ua = navigator.userAgent;
    var sys = /Android/.test(ua) ? 'Android' : /iPhone|iPad/.test(ua) ? 'iPhone/iPad' : /Macintosh/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'PC Windows' : 'Appareil';
    var nav = /Edg\//.test(ua) ? 'Edge' : /Chrome\//.test(ua) ? 'Chrome' : /Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : '';
    return sys + (nav ? ' · ' + nav : '') + ' (sans nom)';
  }

  // ouverture = noter une connexion dans le journal (au lancement, ou au retour après une longue pause)
  var derniereOuverture = 0;
  function synchroniser(ouverture) {
    if (!code) return Promise.resolve(false);
    if (ouverture === true) derniereOuverture = Date.now();
    var p = attente.length ? serveur('ajouterSeances', code, JSON.stringify(attente), appareil())
      : serveur('charger', code, appareil(), ouverture === true);
    return p.then(recevoir, echec);
  }

  // Écran du code d'accès (une fois par appareil)
  function demanderCode() {
    if (document.getElementById('ecran-code')) return;
    var e = document.createElement('div');
    e.id = 'ecran-code'; e.className = 'boite-fond';
    var nomActuel = ''; try { nomActuel = localStorage.getItem('mathos.poste') || ''; } catch (err) {}
    e.innerHTML = '<form class="boite"><h2>MathOS</h2><p>Entrez le code d\'accès pour ouvrir l\'entraînement.</p>' +
      '<input id="code-acces" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="Code d\'accès">' +
      '<p class="note" style="margin:12px 0 0">Nom de cet appareil (pour le journal des connexions) :</p>' +
      '<input id="code-appareil" autocomplete="off" maxlength="40" placeholder="ex. Téléphone de Louise-Marie" value="' + nomActuel.replace(/"/g, '&quot;') + '">' +
      '<p class="note" id="code-msg" style="min-height:1.2em"></p><div class="ligne-btn"><button class="btn" type="submit">Entrer</button></div></form>';
    e.style.height = Math.max(document.documentElement.scrollHeight, 600) + 'px';
    document.body.appendChild(e);
    var f = e.querySelector('form'); f.style.position = 'relative'; f.style.top = '80px';
    var champ = e.querySelector('#code-acces'), msg = e.querySelector('#code-msg');
    champ.focus();
    e.querySelector('form').onsubmit = function (ev) {
      ev.preventDefault();
      msg.textContent = 'Vérification…';
      var nom = e.querySelector('#code-appareil').value.trim();
      try { if (nom) localStorage.setItem('mathos.poste', nom); } catch (err) {}
      serveur('verifierCode', champ.value.trim(), appareil()).then(function (bon) {
        if (!bon) { msg.textContent = 'Code incorrect.'; champ.select(); return; }
        code = champ.value.trim(); ecrireLocal(CODE, code);
        e.remove();
        synchroniser(true);
      }, function () { msg.textContent = 'Connexion impossible. Vérifiez internet et réessayez.'; });
    };
  }

  function demarrer() {
    if (!code) { notifier('local', 'Code d\'accès à saisir'); demanderCode(); return Promise.resolve(); }
    return synchroniser(true);
  }

  function ajouterSeance(s) {
    attente.push(s); ecrireLocal(ATTENTE, attente);
    donnees.seances.push(s); ecrireLocal(CLE, donnees);
    return synchroniser();
  }
  function majReglages(r) {
    Object.assign(donnees.reglages, r, { maj: Date.now() });
    ecrireLocal(CLE, donnees);
    return serveur('majReglages', code, JSON.stringify(donnees.reglages), codeParent, appareil()).then(recevoir, echec);
  }
  function reinitialiser() {
    attente = []; ecrireLocal(ATTENTE, attente);
    return serveur('reinitialiser', code, codeParent, appareil()).then(recevoir, echec);
  }
  // Accès aux Réglages réservé aux parents (code vérifié par le programme Google)
  function verifierParent(c) {
    if (codeParent) return Promise.resolve(true);
    if (!c) return Promise.resolve(false);
    return serveur('verifierCodeParent', code, c, appareil()).then(function (bon) { if (bon) codeParent = c; return bon; });
  }
  // Journal des connexions (lisible seulement avec le code parent)
  function journal() {
    return serveur('journal', code, codeParent, 300).then(function (j) { return JSON.parse(j); });
  }
  function exporter() { throw { code: 'indisponible' }; }
  function importer(fichier) {
    return fichier.text().then(function (t) {
      var d = JSON.parse(t);
      var ids = {}; donnees.seances.forEach(function (s) { ids[s.id] = 1; });
      (d.seances || []).forEach(function (s) { if (!ids[s.id]) attente.push(s); });
      ecrireLocal(ATTENTE, attente);
      return synchroniser();
    });
  }

  // revenir sur l'onglet = relire le Drive (séances faites sur un autre appareil)
  // (au-delà de 30 min d'absence, le retour compte comme une nouvelle connexion dans le journal)
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) synchroniser(Date.now() - derniereOuverture > 30 * 60 * 1000);
  });

  global.Sync = {
    web: true, google: true,
    get donnees() { return donnees; },
    get etat() { return etat; },
    dossierNom: '',
    compatible: true,
    demarrer: demarrer,
    connecter: function () { return Promise.resolve(false); },
    synchroniser: synchroniser,
    ajouterSeance: ajouterSeance, majReglages: majReglages, reinitialiser: reinitialiser, exporter: exporter, importer: importer,
    verifierParent: verifierParent, journal: journal, appareil: appareil,
    surChangement: function (fn) { ecouteurs.push(fn); },
    surMiseAJour: function (fn) { surMaj = fn; }
  };
})(window);

</script>
<script>
/* MathOS — interface : accueil, séances (écran / oral), bilan, progrès, règles, réglages. */
(function () {
  'use strict';
  var E = window.Exos, S = window.Sync;
  var $vue = document.getElementById('vue');
  var THEME = {}; E.THEMES.forEach(function (t) { THEME[t.id] = t; });
  var NOTION = {}; E.GENERATEURS.forEach(function (g) { NOTION[g.id] = g; });
  var LETTRES = ['A', 'B', 'C', 'D'];
  var minuteur = null, seance = null, vueCourante = 'accueil';

  function D() { return S.donnees; }
  function prenom() { return D().reglages.prenom || 'Louise-Marie'; }
  function modeEssai() { try { return localStorage.getItem('mathos.essai') === '1'; } catch (e) { return false; } }
  function poste() { try { return localStorage.getItem('mathos.poste') || ''; } catch (e) { return ''; } }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  // Boîte de dialogue dans la page : boutons = [[libellé, valeur, classe]] ; saisie = texte attendu (optionnel)
  // Dernier endroit touché : les fenêtres et messages s'affichent là, visibles même dans un cadre très haut
  var dernierY = 0;
  document.addEventListener('pointerdown', function (e) { dernierY = e.pageY; }, true);
  function placer(el, decalage) {
    el.style.top = Math.max(16, Math.min(dernierY + decalage, document.documentElement.scrollHeight - 220)) + 'px';
    try { el.scrollIntoView({ block: 'nearest' }); } catch (e) {}
  }
  // valider (facultatif) : appelé au clic sur un bouton de valeur vraie ; renvoie une promesse
  // de true (fermer) ou d'un message d'erreur (la fenêtre reste ouverte et affiche le message)
  function boite(html, boutons, saisie, valider) {
    return new Promise(function (ok) {
      var fond = document.createElement('div');
      fond.className = 'boite-fond';
      fond.style.height = document.documentElement.scrollHeight + 'px';
      fond.innerHTML = '<div class="boite" role="dialog" aria-modal="true"><div>' + html + '</div>' +
        (saisie ? '<input id="boite-saisie" autocomplete="off" placeholder="' + saisie + '">' : '') +
        '<p class="note" id="boite-msg" style="min-height:1.2em;margin:8px 0 0"></p>' +
        '<div class="ligne-btn">' + boutons.map(function (b, i) { return '<button class="btn ' + (b[2] || '') + '" data-i="' + i + '">' + b[0] + '</button>'; }).join('') + '</div></div>';
      document.body.appendChild(fond);
      var bt0 = fond.querySelector('.boite'); bt0.style.position = 'relative'; placer(bt0, -60);
      var champ = fond.querySelector('#boite-saisie');
      (champ || fond.querySelector('button')).focus();
      var msg = fond.querySelector('#boite-msg'), btns = fond.querySelectorAll('button');
      function fermer(b) { fond.remove(); ok(saisie ? { valeur: b[1], texte: champ.value } : b[1]); }
      btns.forEach(function (bt) {
        bt.onclick = function () {
          var b = boutons[+bt.getAttribute('data-i')];
          if (!valider || !b[1]) return fermer(b);
          btns.forEach(function (x) { x.disabled = true; });
          msg.textContent = 'Vérification…';
          valider(champ ? champ.value.trim() : b[1]).then(function (r) {
            if (r === true) return fermer(b);
            btns.forEach(function (x) { x.disabled = false; });
            msg.textContent = r; if (champ) { champ.select(); champ.focus(); }
          });
        };
      });
      // Entrée = bouton principal (le dernier)
      if (champ) champ.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); btns[btns.length - 1].click(); } };
    });
  }
  function toast(msg) {
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); placer(t, 30);
    setTimeout(function () { t.remove(); }, 3500);
  }
  function pct(x) { return Math.round(x * 100) + ' %'; }
  function dateCourte(iso) { var d = new Date(iso); return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); }
  function jour(iso) { return iso.slice(0, 10); }
  function mmss(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  var minuteurQ = null;
  function arreterMinuteurQ() { if (minuteurQ) { clearInterval(minuteurQ); minuteurQ = null; } }
  function arreterMinuteur() { if (minuteur) { clearInterval(minuteur); minuteur = null; } arreterMinuteurQ(); taire(); }

  // Lecture à voix haute (synthèse vocale du navigateur) : les écritures mathématiques sont dites en français
  function texteOral(html) {
    return String(html).replace(/<svg[\s\S]*?<\/svg>/g, '').replace(/<table[\s\S]*?<\/table>/g, ' (voir le tableau) ')
      .replace(/<span class="frac"><span>([^<]*)<\/span><span>([^<]*)<\/span><\/span>/g, ' $1 sur $2 ')
      .replace(/<sup>2<\/sup>|²/g, ' au carré ').replace(/<sup>3<\/sup>|³/g, ' au cube ').replace(/<sup>([^<]*)<\/sup>/g, ' puissance $1 ')

  // Tirage pondéré sans dépasser 2 questions par notion

  // Formats de réponse : « seule » = aucune proposition, correction immédiate ;

  function enBrevet(s) { return s.mode === 'epreuve' || s.format === 'brevet'; }
  function fabriquer(g, format, niveau) {
    if (format === 'brevet') return E.creer(g, false);   // proportion de QCM proche des sujets (≈ 40 %)
    if (format === 'seule') {
      var q = E.creerSansChoix(g, niveau);
      // notion impossible sans propositions (« Laquelle de ces… ») : une autre notion du même thème, sinon au hasard
      var autres = E.shuffle(E.GENERATEURS.filter(function (x) { return !x.hors && x.id !== g.id; })).sort(function (a, b) { return (b.theme === g.theme) - (a.theme === g.theme); });
      for (var i = 0; !q && i < autres.length; i++) q = E.creerSansChoix(autres[i], niveau);

  function composer(mode, theme, sujet, format) {
    var et = etatNotions(), G = E.GENERATEURS, liste = [];

    if (modele) return modele.notions.map(function (id) { return E.creer(NOTION[id], false); });
    if (mode === 'epreuve') {
      // format des sujets zéro 2026 : 6 questions à 0,5 point puis 3 questions à 1 point,
      // uniquement des notions de la liste officielle, en variant les thèmes
      var officielles = G.filter(function (g) { return !g.hors; }), vus = {};
      function piocher(pts, nb) {
        // tirage pondéré : les notions qui tombent le plus dans les sujets 2026 sortent plus souvent
        var cand = officielles.filter(function (g) { return g.pts === pts; }), pool = [];
        while (cand.length) {
          var tot = cand.reduce(function (t, g) { return t + (FREQ_BREVET[g.id] || 1); }, 0), r = Math.random() * tot, k = 0;
          for (; k < cand.length - 1; k++) { r -= FREQ_BREVET[cand[k].id] || 1; if (r <= 0) break; }

        pool.forEach(function (g) { if (res.length < nb && res.indexOf(g) < 0) res.push(g); });

    } else if (mode === 'difficultes') {
      var dif = G.filter(function (g) { return et[g.id].statut === 'revoir'; });
      liste = tirer(dif, function (g) { return et[g.id].priorite; }, 10);
      if (liste.length < 10) liste = liste.concat(tirer(G.filter(function (g) { return et[g.id].statut === 'encours' || et[g.id].statut === 'reviser'; }), function () { return 1; }, 10 - liste.length));
    } else { // entraînement du jour : notions vues en classe, 6 difficultés, puis nouveautés et révisions, puis hasard
      var compte = {};
      var classe = (D().reglages.enClasse || []).filter(function (id) { return NOTION[id]; }).map(function (id) { return NOTION[id]; });
      if (classe.length) liste = tirer(classe, function (g) { return 1 + et[g.id].priorite; }, Math.min(4, classe.length * 2), compte);
      var revoir = G.filter(function (g) { return et[g.id].statut === 'revoir'; });

  function tuile(mode, ico, titre, sous) {
    return '<button class="tuile" data-mode="' + mode + '"><span class="ico">' + ico + '</span><b>' + titre + '</b><small>' + sous + '</small></button>';
  }
  function raccourcir(s, n) { s = String(s).replace(/<span class="frac"><span>([^<]*)<\/span><span>([^<]*)<\/span><\/span>/g, '$1/$2').replace(/<sup>([^<]*)<\/sup>/g, '^$1').replace(/<[^>]+>/g, ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

  // =====================================================================
  //  Choix du mode de réponse avant la séance
  // =====================================================================
  function configurer(mode) {
    vueCourante = 'config';
    var dernier = 'ecran', format = 'seule';
    try { dernier = localStorage.getItem('mathos.repondre') || 'ecran'; format = localStorage.getItem('mathos.format') || 'seule'; } catch (e) {}
    var titres = { jour: 'Entraînement du jour', epreuve: 'Épreuve blanche', difficultes: 'Revoir mes difficultés', theme: 'Travailler un thème', sujet: 'Sujets du brevet 2026' };
    var html = '<div class="carte"><h2>' + titres[mode] + '</h2>';
    if (mode === 'epreuve') html += '<p class="note">Format des sujets zéro du ministère : 9 questions sans calculatrice en 20 minutes, 6 questions à 0,5 point puis 3 questions à 1 point (note sur 6). Les corrections sont données à la fin, comme au brevet.</p>';
    if (mode === 'sujet') {
      html += '<p class="note">Chaque épreuve reprend, dans le même ordre, les notions d\'un vrai sujet de 2026, avec des nombres nouveaux. 20 minutes, sans calculatrice, note sur 6.</p>' +
        '<h3>Quel sujet ?</h3><div class="themes-sel">' + SUJETS_2026.map(function (x, i) {
          return '<button data-sujet="' + x.id + '"' + (i === 0 ? ' class="on"' : '') + '>' + x.nom + ' · ' + x.notions.length + ' q.</button>'; }).join('') + '</div>';
    }
    if (mode === 'theme') {
      html += '<h3>Quel thème ?</h3><div class="themes-sel">' + E.THEMES.map(function (t, i) {
        return '<button data-theme="' + t.id + '"' + (i === 0 ? ' class="on"' : '') + '>' + t.icone + ' ' + t.nom + '</button>'; }).join('') + '</div>';
    }
    if (mode === 'jour' || mode === 'difficultes' || mode === 'theme') {
      html += '<h3>Format des réponses</h3><div class="choix-mode">' +
        '<input type="radio" name="format" id="f-seule" value="seule"' + (format === 'seule' ? ' checked' : '') + '><label for="f-seule"><b>🖊️ Je trouve seule</b><br><small class="note">Aucune proposition de réponse : on écrit son résultat. Correction et méthode tout de suite.</small></label>' +
        '<input type="radio" name="format" id="f-brevet" value="brevet"' + (format === 'brevet' ? ' checked' : '') + '><label for="f-brevet"><b>🎓 Conditions du brevet</b><br><small class="note">Comme les vrais sujets : QCM et réponses directes mélangés, chrono (2 min par question), corrections à la fin.</small></label></div>';
    } else {
      html += '<p class="note">🎓 Format du brevet : QCM et réponses directes mélangés comme dans les vrais sujets, corrections à la fin.</p>';
    }
    html += '<h3>Qui répond ?</h3><div class="choix-mode">' +
      '<input type="radio" name="rep" id="r-ecran" value="ecran"' + (dernier === 'ecran' ? ' checked' : '') + '><label for="r-ecran"><b>💻 ' + esc(prenom()) + ' à l\'ordinateur</b><br><small class="note">Elle tape ou clique ses réponses, correction automatique.</small></label>' +
      '<input type="radio" name="rep" id="r-oral" value="oral"' + (dernier === 'oral' ? ' checked' : '') + '><label for="r-oral"><b>🗣️ À l\'oral avec un parent</b><br><small class="note">Le parent lit la question, affiche la réponse et note juste / faux.</small></label></div>' +
      '<div class="ligne-btn"><button class="btn" id="go">Commencer</button><button class="btn sec" data-nav-local="accueil">Retour</button></div></div>';
    $vue.innerHTML = html;
    var theme = E.THEMES[0].id, sujet = SUJETS_2026[0].id;
    $vue.querySelectorAll('[data-sujet]').forEach(function (b) {
      b.onclick = function () { $vue.querySelectorAll('[data-sujet]').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); sujet = b.getAttribute('data-sujet'); };
    });
    $vue.querySelectorAll('[data-theme]').forEach(function (b) {
      b.onclick = function () { $vue.querySelectorAll('[data-theme]').forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); theme = b.getAttribute('data-theme'); };
    });
    $vue.querySelector('[data-nav-local]').onclick = function () { aller('accueil'); };
    document.getElementById('go').onclick = function () {
      var rep = $vue.querySelector('input[name=rep]:checked').value;
      var fm = $vue.querySelector('input[name=format]:checked'), fmt = fm ? fm.value : 'brevet';
      try { localStorage.setItem('mathos.repondre', rep); if (fm) localStorage.setItem('mathos.format', fmt); } catch (e) {}
      if (mode === 'sujet') demarrer('epreuve', rep, theme, sujet); else demarrer(mode, rep, theme, null, fmt);
    };
  }

  // =====================================================================
  //  Séance
  // =====================================================================
  function demarrer(mode, repondre, theme, sujet, format) {
    var modele = SUJETS_2026.filter(function (x) { return x.id === sujet; })[0];
    format = mode === 'epreuve' ? 'brevet' : (format || 'seule');
    var qs = composer(mode, theme, sujet, format);
    seance = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), mode: mode, repondre: repondre, theme: mode === 'theme' ? theme : '', format: format,
               sujet: modele ? modele.nom : '', debut: new Date().toISOString(), qs: qs, i: 0, rep: [], fini: false, t0: Date.now(), tq: Date.now(),
               limite: mode === 'epreuve' ? 20 * 60 : format === 'brevet' ? qs.length * 120 : 0 };
    if (seance.limite) {
      minuteur = setInterval(function () {
        var reste = seance.limite - (Date.now() - seance.t0) / 1000, c = document.getElementById('chrono');
        if (c) { c.textContent = '⏱ ' + mmss(reste); c.classList.toggle('urgent', reste < 120); }
        if (reste <= 0) { arreterMinuteur(); toast('Temps écoulé : la séance est terminée.'); terminer(); }
      }, 1000);
    }
    afficherQuestion();
  }

  function enteteQuestion() {
    var s = seance, n = s.qs.length, q = s.qs[s.i];
    var reste = s.limite ? s.limite - (Date.now() - s.t0) / 1000 : 0;
    return '<div class="entete-q"><span>Question ' + (s.i + 1) + ' / ' + n + ' · ' + THEME[q.theme].icone + ' ' + esc(q.notion) + '</span>' +
      (s.limite ? '<span id="chrono" class="chrono">⏱ ' + mmss(reste) + '</span>' : '') +
      (s.repondre === 'oral' && !s.limite ? '<span id="chrono-q" class="chrono">⏳ 2:00</span>' : '') + '</div>' +
      '<div class="progress"><div style="width:' + (100 * s.i / n) + '%"></div></div>';
  }

  function afficherQuestion() {
    var s = seance, q = s.qs[s.i], oral = s.repondre === 'oral';
    s.tq = Date.now();
    arreterMinuteurQ(); taire();
    // à l'oral : environ 2 minutes par question, comme le jour J (indicatif, rien ne se bloque)
    if (oral && !s.limite) minuteurQ = setInterval(function () {
      var c = document.getElementById('chrono-q'); if (!c) return arreterMinuteurQ();
      var reste = 120 - (Date.now() - s.tq) / 1000;
      c.textContent = reste > 0 ? '⏳ ' + mmss(reste) : '⏳ temps conseillé dépassé'; c.classList.toggle('urgent', reste < 20);
    }, 1000);
    var html = '<div class="carte' + (oral ? ' oral' : '') + '">' + enteteQuestion() +
      '<div class="enonce">' + q.texte + '</div>' + (q.figure || '');
    if (q.type === 'qcm') {
      html += '<div class="qcm">' + q.choix.map(function (c, k) { return '<button data-c="' + k + '"><span class="l">' + LETTRES[k] + '</span>' + c + '</button>'; }).join('') + '</div>';
      if (oral) html += '<p class="aide">Cliquez sur la réponse qu\'elle donne, ou affichez la réponse.</p>';
    } else if (q.type === 'libre') {
      html += '<div class="saisie"><input id="rep" autocomplete="off" autocapitalize="off" placeholder="' + (oral ? 'Sa réponse (facultatif)' : 'Ta réponse') + '">' +
        '<span class="touches">' + ['−', '²', '×', '/'].map(function (t) { return '<button type="button" class="btn sec touche" data-t="' + t + '">' + t + '</button>'; }).join('') + '</span>' +
        '<button class="btn" id="valider">' + (oral ? 'Vérifier sa réponse' : 'Valider') + '</button></div>' +
        '<p class="aide">Aucune proposition : écris ta réponse (un nombre, une expression comme 3x² − 2x, ou un mot comme « losange »).</p>';
    } else {
      html += '<div class="saisie"><input id="rep" autocomplete="off" inputmode="decimal" placeholder="' + (oral ? 'Sa réponse (facultatif)' : 'Ta réponse') + '">' +
        (q.unite ? '<span class="note">' + esc(q.unite) + '</span>' : '') +
        '<span class="touches">' + ['−', ',', '/'].map(function (t) { return '<button type="button" class="btn sec touche" data-t="' + t + '">' + t + '</button>'; }).join('') + '</span>' +
        '<button class="btn" id="valider">' + (oral ? 'Vérifier sa réponse' : 'Valider') + '</button></div>' +
        '<p class="aide">' + (q.aide === 'fraction' ? 'Pour une fraction, écrire par exemple 3/4. ' : '') + 'Virgule ou point acceptés, signe moins avec la touche « - ».</p>';
    }
    html += '<div class="ligne-btn">' + (oral ? '<button class="btn sec" id="voir">👁 Afficher la réponse</button>' : '') +
      ('speechSynthesis' in window ? '<button class="btn sec" id="lire">🔊 Lire la question</button>' : '') +
      '<button class="btn sec" id="brouillon-bt">✏️ Brouillon</button>' +
      (enBrevet(s) && !oral ? '<button class="btn sec" id="passer">Passer (je ne sais pas)</button>' : '') + '</div><div id="retour"></div></div>';
    $vue.innerHTML = html;

    var inp = document.getElementById('rep');
    if (inp) {
      inp.focus();
      inp.onkeydown = function (e) { if (e.key === 'Enter') document.getElementById('valider').click(); };
      document.getElementById('valider').onclick = function () { if (inp.value.trim() !== '') repondre(inp.value.trim()); };
      $vue.querySelectorAll('[data-t]').forEach(function (bt) {
        bt.onclick = function () { var t = bt.getAttribute('data-t'); inp.value = t === '−' && q.type !== 'libre' ? (inp.value.charAt(0) === '-' ? inp.value.slice(1) : '-' + inp.value) : inp.value + t; inp.focus(); };
      });
    }
    $vue.querySelectorAll('[data-c]').forEach(function (b) {
      b.onclick = function () { if (!b.disabled) repondre(+b.getAttribute('data-c')); };
    });
    document.getElementById('brouillon-bt').onclick = function () { brouillon(this); };
    var lireBt = document.getElementById('lire');
    if (lireBt) lireBt.onclick = function () {
      lire(texteOral(q.texte) + (q.type === 'qcm' ? '. ' + q.choix.map(function (c, k) { return 'Réponse ' + LETTRES[k] + ' : ' + texteOral(c); }).join('. ') : ''));
    };
    var voir = document.getElementById('voir');
    if (voir) voir.onclick = reveleOral;
    var passer = document.getElementById('passer');
    if (passer) passer.onclick = function () { repondre(null); };
  }

  // Brouillon : une zone pour poser un calcul au doigt ou à la souris, comme la feuille de brouillon du jour J
  function brouillon(bouton) {
    var ex = document.getElementById('brouillon');
    if (ex) { ex.remove(); return; }
    var z = document.createElement('div');
    z.id = 'brouillon'; z.className = 'brouillon';
    z.innerHTML = '<canvas></canvas><div class="ligne-btn"><button class="btn sec" data-b="effacer">Effacer</button><button class="btn sec" data-b="fermer">Fermer le brouillon</button></div>';
    bouton.closest('.ligne-btn').after(z);
    var c = z.querySelector('canvas'), ctx = c.getContext('2d'), ratio = window.devicePixelRatio || 1;
    c.width = c.clientWidth * ratio; c.height = c.clientHeight * ratio; ctx.scale(ratio, ratio);
    ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--encre').trim() || '#222';
    var actif = false;
    function pos(e) { var r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
    c.addEventListener('pointerdown', function (e) { actif = true; c.setPointerCapture(e.pointerId); var p = pos(e); ctx.beginPath(); ctx.moveTo(p[0], p[1]); e.preventDefault(); });
    c.addEventListener('pointermove', function (e) { if (!actif) return; var p = pos(e); ctx.lineTo(p[0], p[1]); ctx.stroke(); e.preventDefault(); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) { c.addEventListener(t, function () { actif = false; }); });
    z.querySelector('[data-b=effacer]').onclick = function () { ctx.clearRect(0, 0, c.width, c.height); };
    z.querySelector('[data-b=fermer]').onclick = function () { z.remove(); };
  }

  // Fiche méthode d'une notion (règle, exemple résolu, piège classique), repliable
  function ficheHTML(id) {
    var f = window.FICHES && window.FICHES[id];
    if (!f) return '';
    return '<details class="fiche"><summary>📖 La méthode</summary><p><b>À retenir :</b> ' + f.regle + '</p><p><b>Exemple :</b> ' + f.exemple + '</p><p><b>⚠️ Piège :</b> ' + f.piege + '</p></details>';
  }

  function texteReponse(q, rep) {
    if (rep === null || rep === undefined) return '(pas de réponse)';
    return q.type === 'qcm' ? LETTRES[rep] + '. ' + q.choix[rep] : esc(rep) + (q.unite ? ' ' + esc(q.unite) : '');
  }

  // Enregistre la réponse ; en épreuve (écran) on passe directement à la suite
  function repondre(rep, okManuel) {
    var s = seance, q = s.qs[s.i];
    var ok = okManuel !== undefined ? okManuel : (rep !== null && E.verifier(q, rep));
    var diag = (!ok && rep !== null && rep !== undefined) ? E.diagnostiquer(q, rep) : '';
    s.rep[s.i] = { g: q.gen, t: q.theme, ok: ok, r: rep === null || rep === undefined ? '' : (q.type === 'qcm' ? LETTRES[rep] + '. ' + q.choix[rep] : esc(String(rep))),
                   q: q.texte, br: q.reponse, d: diag, ms: Date.now() - s.tq, p: q.pts, n: q.notion };
    if (enBrevet(s) && s.repondre === 'ecran') return suivante();
    // réponse écrite non reconnue : l'élève (ou le parent) juge si c'est la même chose écrite autrement
    if (!ok && q.type === 'libre' && okManuel === undefined && rep !== null) return autoEvaluation(q, rep, diag);
    afficherRetour(q, rep, ok, diag);
  }
  function autoEvaluation(q, rep, diag) {
    var s = seance, i = s.i;
    var inp = document.getElementById('rep'); if (inp) inp.disabled = true;
    ['valider', 'voir', 'passer'].forEach(function (id) { var b = document.getElementById(id); if (b) b.remove(); });
    document.getElementById('retour').innerHTML = '<div class="retour neutre"><div class="titre">Compare avec la réponse attendue</div>' +
      '<p>Ta réponse : <b>' + esc(rep) + '</b><br>Réponse attendue : <b>' + q.reponse + '</b></p><p class="note">Est-ce la même chose, écrite autrement ?</p></div>' +
      '<div class="ligne-btn"><button class="btn ok" id="pareil">✓ Oui, c\'est pareil</button><button class="btn ko" id="different">✗ Non</button></div>';
    document.getElementById('pareil').onclick = function () { s.rep[i].ok = true; s.rep[i].d = ''; afficherRetour(q, rep, true, ''); };
    document.getElementById('different').onclick = function () { afficherRetour(q, rep, false, diag); };
  }

  function afficherRetour(q, rep, ok, diag) {
    var s = seance;
    // désactive la saisie
    $vue.querySelectorAll('[data-c]').forEach(function (b, k) {
      b.disabled = true; b.style.cursor = 'default';
      if (k === q.bonne) b.classList.add('bonne'); else if (k === rep) b.classList.add('fausse');
    });
    var inp = document.getElementById('rep'); if (inp) inp.disabled = true;
    ['valider', 'voir', 'passer'].forEach(function (id) { var b = document.getElementById(id); if (b) b.remove(); });

    if (enBrevet(s)) {
      document.getElementById('retour').innerHTML = '<div class="retour neutre"><div class="titre">' + (ok ? '✓ Noté juste' : '✗ Noté faux') + '</div><p class="note">Comme au brevet : les corrections sont données à la fin.</p></div>' +
        '<div class="ligne-btn"><button class="btn" id="suivante">' + (s.i + 1 < s.qs.length ? 'Question suivante →' : 'Voir le bilan') + '</button></div>';
      var bs = document.getElementById('suivante'); bs.focus(); bs.onclick = suivante;
      return;
    }
    var html = '<div class="retour ' + (ok ? 'ok' : 'ko') + '"><div class="titre">' + (ok ? '✓ Bonne réponse !' : '✗ Ce n\'est pas ça') + '</div>';
    if (ok && q.type === 'num' && E.nonSimplifiee(rep)) html += '<p>Juste, mais pense à simplifier : <b>' + q.reponse + '</b>.</p>';
    if (!ok) {
      if (rep !== null && rep !== undefined) html += '<p>Réponse donnée : ' + texteReponse(q, rep) + '<br>Bonne réponse : <b>' + q.reponse + '</b></p>';
      else html += '<p>Bonne réponse : <b>' + q.reponse + '</b></p>';
      if (diag) html += '<p>🔎 <b>Ce qui s\'est sans doute passé :</b> ' + diag + '</p>';
    }
    html += '<p>📝 <b>Correction :</b> ' + q.correction + '</p>' + ficheHTML(q.gen) + '</div><div class="ligne-btn">';
    if (!ok) html += '<button class="btn sec" id="similaire">🔁 Une question du même type</button>';
    html += '<button class="btn" id="suivante">' + (s.i + 1 < s.qs.length ? 'Question suivante →' : 'Voir le bilan') + '</button></div>';
    document.getElementById('retour').innerHTML = html;
    var b = document.getElementById('suivante'); b.focus(); b.onclick = suivante;
    var sim = document.getElementById('similaire');
    if (sim) sim.onclick = function () { s.qs.splice(s.i + 1, 0, fabriquer(NOTION[q.gen], s.format, 1)); suivante(); };
  }

  // Mode oral : le parent affiche la réponse puis note juste / faux
  function reveleOral() {
    var s = seance, q = s.qs[s.i];
    var voir = document.getElementById('voir'); if (voir) voir.remove();
    document.getElementById('retour').innerHTML = '<div class="retour neutre"><div class="titre">Réponse attendue : ' + q.reponse + (q.unite && q.type === 'num' ? ' ' + esc(q.unite) : '') + '</div>' +
      (enBrevet(s) ? '<p class="note">Corrections à la fin, comme au brevet.</p>' : '<p>📝 ' + q.correction + '</p>' + ficheHTML(q.gen)) + '</div><div class="ligne-btn"><button class="btn ok" id="juste">✓ Elle a juste</button><button class="btn ko" id="faux">✗ Elle s\'est trompée</button></div>' +
      (enBrevet(s) ? '' : '<p class="aide">Astuce : si elle s\'est trompée, tapez sa réponse dans le champ ci-dessus (ou cliquez sa proposition) puis « Vérifier » pour obtenir l\'explication de l\'erreur.</p>');
    document.getElementById('juste').onclick = function () { repondre(null, true); };
    document.getElementById('faux').onclick = function () { repondre(null, false); };
    var inp = document.getElementById('rep');
    var val = document.getElementById('valider');
    if (val) val.textContent = 'Vérifier sa réponse';
    if (inp) inp.placeholder = 'Sa réponse (pour analyser l\'erreur)';
  }

  function suivante() {
    var s = seance;
    s.i++;
    if (s.i >= s.qs.length) return terminer();
    afficherQuestion();
  }

  function terminer() {
    var s = seance;
    arreterMinuteur();
    if (s.fini) return;
    s.fini = true;
    // questions non traitées (temps écoulé) : comptées fausses
    for (var i = 0; i < s.qs.length; i++) if (!s.rep[i]) {
      var q = s.qs[i];
      s.rep[i] = { g: q.gen, t: q.theme, ok: false, r: '', q: q.texte, br: q.reponse, d: 'Non traitée (temps écoulé).', ms: 0, p: q.pts, n: q.notion };
    }
    var score = s.rep.filter(function (r) { return r.ok; }).length;
    var totalPts = s.rep.reduce(function (t, r) { return t + (r.p || 0); }, 0);
    var note = s.mode === 'epreuve' && totalPts ? Math.round(s.rep.reduce(function (t, r) { return t + (r.ok ? r.p : 0); }, 0) / totalPts * 60) / 10 : undefined;
    var enreg = { id: s.id, debut: s.debut, fin: new Date().toISOString(), duree: Math.round((Date.now() - s.t0) / 1000), poste: poste() || (S.appareil ? S.appareil() : 'Mac'),
                  mode: s.mode, repondre: s.repondre, format: s.format, theme: s.theme, sujet: s.sujet || undefined, score: score, note: note, total: s.rep.length, rep: s.rep };
    if (!modeEssai()) S.ajouterSeance(enreg);
    bilan(enreg, s.qs);
  }

  function bilan(enr, qs) {
    var sur6 = sur6De(enr);
    var html = '<div class="carte"><h1>' + (enr.score / enr.total >= 0.8 ? '🎉 Excellent !' : enr.score / enr.total >= 0.5 ? '👍 Bien joué' : '💪 On continue !') + '</h1>' +
      '<div class="kpis"><div class="kpi"><div class="v">' + enr.score + ' / ' + enr.total + '</div><div class="t">bonnes réponses</div></div>' +
      (enr.mode === 'epreuve' ? '<div class="kpi"><div class="v">' + E.f(sur6) + ' / 6</div><div class="t">note estimée (barème : 6 points)</div></div>' : '') +
      '<div class="kpi"><div class="v">' + mmss(enr.duree) + '</div><div class="t">durée</div></div></div>' +
      (modeEssai() ? '<p class="retour neutre">🧪 Mode essai : cette séance n\'a pas été enregistrée dans la progression.</p>' : '');
    var fausses = enr.rep.filter(function (r) { return !r.ok; });
    if (fausses.length) html += '<p>Les notions ratées sont mémorisées : elles reviendront dans « Entraînement du jour » et « Revoir mes difficultés » jusqu\'à ce qu\'elles soient maîtrisées.</p>';
    html += '<h2>Correction détaillée</h2>';
    enr.rep.forEach(function (r, i) {

  // Note sur 6 : barème par question (0,5 ou 1 point) ; anciennes séances : proportionnelle
  function sur6De(s) { return s.note !== undefined ? s.note : Math.round(s.score / s.total * 60) / 10; }
  // Note estimée en fin de chaque semaine depuis la première séance
  function courbeNote(el) {
    var ss = D().seances;
    if (!el) return;
    if (!ss.length) { el.innerHTML = '<p class="note">La courbe apparaîtra après les premières séances.</p>'; return; }
    var pts = [], d = debutSemaine(ss[0].debut), fin = Date.now();
    while (d.getTime() <= fin) { var f = new Date(d.getTime() + 7 * 864e5); pts.push({ debut: new Date(Math.min(f.getTime(), fin)).toISOString(), note: noteEstimee(Math.min(f.getTime(), fin + 1)) }); d = f; }
    pts = pts.slice(-26);
    courbe(el, pts.map(function (p) { return { debut: p.debut, note: p.note, estimation: true }; }));
  }
  function kpi(v, t) { return '<div class="kpi"><div class="v">' + v + '</div><div class="t">' + t + '</div></div>'; }

  // Courbe simple (une série) avec info-bulle au survol
  function courbe(el, ep) {
    var W = 640, H = 220, g = 34, d = 14, h = 16, b = 28;
    var pts = ep.map(function (s, i) { return { x: g + (ep.length === 1 ? (W - g - d) / 2 : i * (W - g - d) / (ep.length - 1)), y: h + (1 - sur6De(s) / 6) * (H - h - b), s: s }; });
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Notes des épreuves blanches sur 6">';
    [0, 2, 4, 6].forEach(function (v) { var y = h + (1 - v / 6) * (H - h - b); svg += '<line class="axe" x1="' + g + '" x2="' + (W - d) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (g - 8) + '" y="' + (y + 4) + '" text-anchor="end">' + v + '</text>'; });
    if (pts.length > 1) svg += '<polyline class="ligne" points="' + pts.map(function (p) { return p.x + ',' + p.y; }).join(' ') + '"/>';
    pts.forEach(function (p, i) {
      svg += '<circle class="pt" cx="' + p.x + '" cy="' + p.y + '" r="5"/>';
      if (i === 0 || i === pts.length - 1 || pts.length <= 8) svg += '<text x="' + p.x + '" y="' + (H - 8) + '" text-anchor="middle">' + new Date(p.s.debut).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) + '</text>';
    });
    svg += '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="transparent" id="zone"/></svg>';
    el.innerHTML = svg;
    var bulle = document.getElementById('bulle'), zone = el.querySelector('#zone'), svgEl = el.querySelector('svg');
    zone.addEventListener('mousemove', function (e) {
      var r = svgEl.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, best = pts[0];
      pts.forEach(function (p) { if (Math.abs(p.x - x) < Math.abs(best.x - x)) best = p; });
      bulle.style.display = 'block'; bulle.style.left = (e.clientX + 12) + 'px'; bulle.style.top = (e.clientY - 34) + 'px';
      bulle.textContent = dateCourte(best.s.debut) + ' : ' + E.f(sur6De(best.s)) + ' / 6' + (best.s.estimation ? ' (estimation)' : ' (' + best.s.score + '/' + best.s.total + ')');
    });
    zone.addEventListener('mouseleave', function () { bulle.style.display = 'none'; });
  }

        (S.google ? '<p class="note">La progression est enregistrée dans votre Google Drive (fichier mathos-progression.json, dossier MATHOS). Ouvrez le même lien MathOS sur les Mac et le téléphone : tout est commun automatiquement.</p>'
          : '<p class="note">La progression est enregistrée en ligne avec la page : ouvrez le même lien MathOS sur les Mac et le téléphone, avec le même compte claude.ai, et tout est commun automatiquement.</p>') +
        '<h3>Sauvegarde et transfert</h3><div class="ligne-btn">' + (S.google ? '' : '<button class="btn sec" id="exp">Exporter la progression</button>') + '<label class="btn sec" style="display:inline-block">Importer un fichier<input type="file" id="imp" accept=".json" class="cache"></label></div>' +
        '<p class="note">« Importer » permet de reprendre les séances faites avec la version Mac (fichier progression.json du Drive).</p></div>' :
      '<div class="carte"><h2>Synchronisation Google Drive</h2>' +
      '<p>État : <b>' + esc(S.etat.message) + '</b>' + (S.dossierNom ? ' — dossier « ' + esc(S.dossierNom) + ' »' : '') + '</p>' +
      (S.compatible ?
        '<p class="note">Sur chaque Mac, ouvrez MathOS avec Google Chrome et choisissez le dossier <b>MathOS</b> qui se trouve dans Google Drive (Mon Drive). La progression est enregistrée dans le fichier progression.json de ce dossier, avec une sauvegarde quotidienne dans « sauvegardes ».</p>' +
        '<div class="ligne-btn"><button class="btn" id="choisir">' + (S.dossierNom ? 'Changer de dossier' : 'Choisir le dossier Drive') + '</button>' + (S.dossierNom ? '<button class="btn sec" id="syncnow">Synchroniser maintenant</button>' : '') + '</div>'
        : '<p class="note">Ce navigateur ne permet pas l\'accès direct au dossier Drive. Utilisez Google Chrome, ou les boutons ci-dessous pour transférer la progression à la main.</p>') +
      '<h3>Transfert manuel (secours)</h3><div class="ligne-btn"><button class="btn sec" id="exp">Exporter la progression</button><label class="btn sec" style="display:inline-block">Importer un fichier<input type="file" id="imp" accept=".json" class="cache"></label></div></div>');
    document.getElementById('enreg').onclick = function () {
      try { localStorage.setItem('mathos.poste', document.getElementById('poste').value.trim()); } catch (e) {}
      S.majReglages({ prenom: document.getElementById('prenom').value.trim(), dateBrevet: document.getElementById('date').value || '2027-06-24', objectifHebdo: Math.min(21, Math.max(1, +document.getElementById('objectif').value || 5)) });
      toast('Réglages enregistrés.');
    };
    document.getElementById('essai').onchange = function (e) {
      try { localStorage.setItem('mathos.essai', e.target.checked ? '1' : '0'); } catch (err) {}
    };
    document.getElementById('raz').onclick = function () {
      var n = D().seances.length;
      boite('<b>Effacer les ' + n + ' séance(s) enregistrée(s) sur tous les ' + (S.web ? 'appareils' : 'postes') + ' ?</b><p class="note">Cette action est définitive. Tapez EFFACER pour confirmer.</p>',
        [['Annuler', false, 'sec'], ['Effacer', true, 'ko']], 'EFFACER').then(function (r) {
        if (!r.valeur) return;
        if (r.texte.trim().toUpperCase() !== 'EFFACER') { toast('Remise à zéro annulée : mot de confirmation incorrect.'); return; }
        S.reinitialiser().then(function () {
          toast('La progression a été remise à zéro.' + (S.web || S.dossierNom ? '' : ' Ce Mac n\'est pas relié au Drive : les autres postes ne sont pas informés.'));
          aller('reglages');
        });
      });
    };
    if (S.journal) afficherJournal(50);
    function notionsClasse() { return [].slice.call(document.querySelectorAll('[data-classe]:checked')).map(function (c) { return c.getAttribute('data-classe'); }); }
    document.getElementById('classe-ok').onclick = function () {
      var ids = notionsClasse(); S.majReglages({ enClasse: ids }); toast(ids.length ? ids.length + ' notion(s) vue(s) en classe enregistrée(s).' : 'Aucune notion cochée.');
    };
    document.getElementById('classe-raz').onclick = function () { document.querySelectorAll('[data-classe]').forEach(function (c) { c.checked = false; }); };
    var ch = document.getElementById('choisir'); if (ch) ch.onclick = function () { S.connecter(true).then(function () { aller('reglages'); }); };
    var sn = document.getElementById('syncnow'); if (sn) sn.onclick = function () { S.synchroniser().then(function () { aller('reglages'); }); };
    if (document.getElementById('exp')) document.getElementById('exp').onclick = function () {
      Promise.resolve().then(S.exporter).catch(function (e) { if (!e || e.code !== 'declined') toast('Export impossible sur cet appareil.'); });
    };
    document.getElementById('imp').onchange = function (e) { if (e.target.files[0]) S.importer(e.target.files[0]).then(function () { toast('Progression importée et fusionnée.'); aller('reglages'); }).catch(function () { toast('Fichier illisible : choisissez un fichier progression.json.'); }); };
  }

  // Journal des connexions (version Google) : les plus récentes d'abord
  function afficherJournal(n) {
    S.journal().then(function (j) {
      var el = document.getElementById('journal');
      if (!el) return;
      if (!j.length) { el.innerHTML = '<p class="note">Aucune connexion enregistrée pour l\'instant.</p>'; return; }
      var jours = {};
      el.innerHTML = '<table class="hist"><tr><th>Quand</th><th>Appareil</th><th>Quoi</th></tr>' +
        j.slice(0, n).map(function (x) {
          var d = new Date(x.t), alerte = /incorrect/.test(x.e);
          var quand = d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
          return '<tr' + (alerte ? ' class="alerte"' : '') + '><td style="white-space:nowrap">' + quand + '</td><td>' + esc(x.a) + '</td><td>' + (alerte ? '⚠️ ' : '') + esc(x.e) + '</td></tr>';
        }).join('') + '</table>' +
        (j.length > n ? '<div class="ligne-btn"><button class="btn sec" id="journal-plus">Afficher tout (' + j.length + ')</button></div>' : '');
      var plus = document.getElementById('journal-plus');
      if (plus) plus.onclick = function () { afficherJournal(j.length); };
    }, function () {
      var el = document.getElementById('journal');
      if (el) el.innerHTML = '<p class="note">Journal indisponible pour le moment (connexion internet ?).</p>';
    });
  }

  // Démarrage
  majPastille(S.etat);
  if (S.surMiseAJour) S.surMiseAJour(rafraichir);
  aller('accueil');
  S.demarrer().then(rafraichir);
})();

</script>
</body></html>
